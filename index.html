<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>跨平台剪贴板 · 暂存箱（优化版）</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* 样式与之前相同，省略以节省篇幅，可复制原样式 */
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #1e2b3c 0%, #0f1a24 100%); margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .app-container { max-width: 1300px; width: 100%; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 32px; padding: 24px; box-shadow: 0 25px 45px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); flex: 1; min-width: 280px; }
        .card h2 { margin-top: 0; color: white; font-weight: 600; border-left: 4px solid #ffb347; padding-left: 16px; }
        .room-area { background: #2c3e33; border-radius: 24px; padding: 20px; margin-bottom: 24px; text-align: center; }
        .room-id { background: #00000066; padding: 12px; border-radius: 60px; font-family: monospace; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; color: #ffd966; margin: 15px 0; word-break: break-all; }
        button { background: #ffb347; border: none; color: #1e2b3c; font-weight: bold; padding: 10px 20px; border-radius: 40px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; margin: 5px; }
        button:hover { background: #ff9f1a; transform: scale(0.97); }
        .input-group { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
        .input-group input { flex: 3; padding: 12px 18px; border-radius: 60px; border: none; background: #f0f2f5; font-size: 1rem; outline: none; }
        .messages { background: #0f1a1faa; border-radius: 24px; padding: 16px; min-height: 250px; max-height: 350px; overflow-y: auto; }
        .msg-item { background: #2e4a3e; margin: 8px 0; padding: 10px 14px; border-radius: 20px; color: white; word-break: break-word; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .msg-text { flex: 1; }
        .copy-btn { background: #4c6a5e; padding: 6px 12px; border-radius: 30px; font-size: 0.7rem; color: white; cursor: pointer; }
        .status { font-size: 0.85rem; background: #00000055; padding: 6px 12px; border-radius: 30px; display: inline-block; margin-top: 10px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .qrcode-container { text-align: center; margin: 15px 0; padding: 15px; background: white; border-radius: 24px; display: inline-block; width: 100%; }
        #qrcode { display: flex; justify-content: center; }
        .warning { color: #ffaa66; font-size: 0.8rem; margin-top: 10px; }
        @media (max-width: 800px) { .card { min-width: 100%; } }
        hr { border-color: #ffffff33; margin: 20px 0; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <h2>📦 我的暂存箱 (电脑)</h2>
        <div class="room-area">
            <div style="color:white; margin-bottom: 8px;">🔑 你的房间号</div>
            <div class="room-id" id="myRoomId">加载中...</div>
            <button id="copyRoomBtn">📋 复制房间号</button>
            <div class="qrcode-container" style="background: transparent;">
                <div id="qrcode" style="background:white; padding:10px; border-radius:20px; display:inline-block;"></div>
                <div class="warning">📱 手机扫码即可加入</div>
            </div>
            <div class="status" id="connStatus">⚡ 等待连接...</div>
        </div>
        <div class="flex-between">
            <span style="color:white;">✏️ 发送新内容</span>
            <span style="color:#ccc; font-size:12px;">自动同步到已连接的设备</span>
        </div>
        <div class="input-group">
            <input type="text" id="sendInput" placeholder="输入文字、代码或网址..." autocomplete="off">
            <button id="sendBtn">📤 发送</button>
        </div>
        <div class="flex-between">
            <span style="color:white;">📜 暂存历史</span>
            <button id="clearHistoryBtn" style="background:#3a5a4e; color:white;">清空暂存箱</button>
        </div>
        <div class="messages" id="messageList">暂无内容</div>
    </div>
    <div class="card">
        <h2>📱 移动设备视图</h2>
        <div style="background:#2a3a30; border-radius:20px; padding:16px;">
            <div style="color:white; margin-bottom:12px;">🔗 加入已有房间</div>
            <div class="input-group">
                <input type="text" id="remotePeerIdInput" placeholder="粘贴房间号">
                <button id="joinBtn">➕ 连接</button>
            </div>
            <div class="status" id="mobileConnStatus">未连接</div>
            <hr>
            <div style="color:white;">📨 接收到的内容</div>
            <div class="messages" id="mobileMsgList" style="max-height:200px;">等待接收...</div>
            <div style="margin-top:16px;">
                <div style="color:white;">📤 从手机发送</div>
                <div class="input-group">
                    <input type="text" id="mobileSendInput" placeholder="输入文字">
                    <button id="mobileSendBtn">📤 发送</button>
                </div>
            </div>
        </div>
        <div class="warning">💡 提示：两台设备打开本页面，电脑端显示房间号，手机端输入相同房间号即可实时传文字。</div>
    </div>
</div>

<script>
    // ------------------- 优化后的代码 -------------------
    let peer;
    let localId = "";
    let currentConn = null;      // 当前活动连接
    let reconnectTimer = null;

    // DOM
    const myRoomIdDiv = document.getElementById('myRoomId');
    const copyRoomBtn = document.getElementById('copyRoomBtn');
    const qrcodeDiv = document.getElementById('qrcode');
    const connStatusSpan = document.getElementById('connStatus');
    const sendInput = document.getElementById('sendInput');
    const sendBtn = document.getElementById('sendBtn');
    const messageList = document.getElementById('messageList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const remotePeerIdInput = document.getElementById('remotePeerIdInput');
    const joinBtn = document.getElementById('joinBtn');
    const mobileConnStatus = document.getElementById('mobileConnStatus');
    const mobileMsgList = document.getElementById('mobileMsgList');
    const mobileSendInput = document.getElementById('mobileSendInput');
    const mobileSendBtn = document.getElementById('mobileSendBtn');

    const STORAGE_KEY = 'clipboard_stash';

    // 加载历史
    function loadHistory() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try { return JSON.parse(stored); } catch(e) { return []; }
        }
        return [];
    }

    function saveHistory(history) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    // 添加记录（优化：不立即全量渲染，使用增量或防抖）
    let pendingRender = false;
    function addToStash(text, direction) {
        if (!text || text.trim() === '') return;
        const history = loadHistory();
        history.unshift({ text: text.trim(), timestamp: Date.now(), direction });
        if (history.length > 50) history.pop();
        saveHistory(history);
        // 防抖渲染，避免高频操作
        if (!pendingRender) {
            pendingRender = true;
            setTimeout(() => {
                renderMessageList();
                pendingRender = false;
            }, 20);
        }
    }

    // 渲染左侧暂存箱（使用 DocumentFragment 减少重绘）
    function renderMessageList() {
        const history = loadHistory();
        if (!history.length) {
            messageList.innerHTML = '<div style="color:#aaa; text-align:center;">✨ 暂无内容，发送或接收后显示</div>';
            return;
        }
        const fragment = document.createDocumentFragment();
        history.forEach(item => {
            const directionIcon = item.direction === 'sent' ? '🚀 我发送' : '📥 收到';
            const timeStr = new Date(item.timestamp).toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'msg-item';
            div.innerHTML = `
                <div class="msg-text">
                    <div style="font-size:0.7rem; opacity:0.7;">${directionIcon} · ${timeStr}</div>
                    <div style="margin-top:4px;">${escapeHtml(item.text)}</div>
                </div>
                <div class="copy-btn" data-text="${escapeHtml(item.text).replace(/"/g, '&quot;')}">📋 复制</div>
            `;
            fragment.appendChild(div);
        });
        messageList.innerHTML = '';
        messageList.appendChild(fragment);
        // 绑定复制事件（事件委托更优，但为简洁，直接绑定）
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.removeEventListener('click', copyHandler);
            btn.addEventListener('click', copyHandler);
        });
    }

    function copyHandler(e) {
        const text = e.currentTarget.getAttribute('data-text');
        copyToClipboard(text);
        const original = e.currentTarget.innerText;
        e.currentTarget.innerText = '✅ 已复制';
        setTimeout(() => { e.currentTarget.innerText = original; }, 1000);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(e=>console.warn);
        else {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }
    }

    // 发送消息（核心修复：准确判断连接状态）
    function sendMessageToPeer(text) {
        if (!currentConn) {
            connStatusSpan.innerHTML = '❌ 未建立连接，请手机端扫码或输入房间号';
            return false;
        }
        // 检查连接是否真正打开
        if (currentConn.open !== true) {
            connStatusSpan.innerHTML = '⚠️ 连接已断开，等待重连...';
            // 尝试重连？可根据业务决定，这里简单提示
            return false;
        }
        if (!text.trim()) return false;
        const payload = { type: 'text', data: text.trim(), from: localId };
        try {
            currentConn.send(payload);
            addToStash(text.trim(), 'sent');
            return true;
        } catch (err) {
            console.error(err);
            connStatusSpan.innerHTML = '❌ 发送失败，连接异常';
            return false;
        }
    }

    // 接收消息
    function onReceiveMessage(data, fromPeerId) {
        let text = '';
        if (data && data.type === 'text' && data.data) text = data.data;
        else if (typeof data === 'string') text = data;
        if (text) {
            addToStash(text, 'received');
            appendMobileReceived(text);
        }
    }

    function appendMobileReceived(text) {
        const div = document.createElement('div');
        div.className = 'msg-item';
        div.style.background = '#1f3b30';
        div.innerHTML = `<div class="msg-text">📱 ${escapeHtml(text)}</div><div class="copy-btn" data-text="${escapeHtml(text)}">复制</div>`;
        mobileMsgList.prepend(div);
        if (mobileMsgList.children.length > 20) mobileMsgList.removeChild(mobileMsgList.lastChild);
        div.querySelector('.copy-btn')?.addEventListener('click', (e) => {
            copyToClipboard(text);
            e.target.innerText = '✅';
            setTimeout(() => e.target.innerText = '复制', 1000);
        });
    }

    // 建立连接（统一处理）
    function setupConnection(conn, isInitiator = false) {
        if (currentConn && currentConn.open && currentConn !== conn) {
            // 关闭旧连接，保持单连接
            currentConn.close();
        }
        currentConn = conn;
        connStatusSpan.innerHTML = '✅ 已与设备建立连接！';
        mobileConnStatus.innerText = '✅ 已连接电脑端';

        conn.on('data', (data) => onReceiveMessage(data, conn.peer));
        conn.on('close', () => {
            if (currentConn === conn) {
                currentConn = null;
                connStatusSpan.innerHTML = '🔌 连接已断开，等待新连接';
                mobileConnStatus.innerText = '❌ 连接断开';
            }
        });
        conn.on('error', (err) => {
            console.warn('Connection error:', err);
            if (currentConn === conn) {
                currentConn = null;
                connStatusSpan.innerHTML = '⚠️ 连接出错，请重新扫码或输入房间号';
                mobileConnStatus.innerText = '⚠️ 连接出错';
            }
        });
        // 对于主动发起的连接，可能尚未open，监听open事件
        if (isInitiator && conn.open === false) {
            conn.on('open', () => {
                connStatusSpan.innerHTML = '✅ 连接已打开';
                mobileConnStatus.innerText = '✅ 已连接电脑端';
            });
        }
    }

    // 主动连接远程设备
    function connectToPeer(remoteId) {
        if (!remoteId.trim()) {
            mobileConnStatus.innerText = '⚠️ 请输入房间号';
            return;
        }
        if (!peer) {
            mobileConnStatus.innerText = '⚠️ 初始化中，稍后再试';
            return;
        }
        if (currentConn && currentConn.open && currentConn.peer === remoteId) {
            mobileConnStatus.innerText = '🔗 已经连接该房间';
            return;
        }
        const newConn = peer.connect(remoteId.trim(), { reliable: true });
        setupConnection(newConn, true);
        newConn.on('open', () => {
            mobileConnStatus.innerText = `✅ 成功连接到 ${remoteId}`;
            connStatusSpan.innerHTML = '✅ 已连接移动设备';
        });
        newConn.on('error', (e) => {
            mobileConnStatus.innerText = '❌ 连接失败，请检查房间号';
            console.error(e);
        });
    }

    // 初始化 Peer
    function initPeer() {
        peer = new Peer({
            debug: 0,
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });
        peer.on('open', (id) => {
            localId = id;
            myRoomIdDiv.innerText = localId;
            qrcodeDiv.innerHTML = '';
            new QRCode(qrcodeDiv, {
                text: window.location.href.split('?')[0] + '?room=' + localId,
                width: 140,
                height: 140,
                correctLevel: QRCode.CorrectLevel.H
            });
            connStatusSpan.innerHTML = '🟢 房间已创建，等待连接...';
            // 自动连接URL参数中的房间号
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room && room !== localId) {
                remotePeerIdInput.value = room;
                setTimeout(() => joinBtn.click(), 500);
            }
        });
        peer.on('connection', (conn) => {
            setupConnection(conn, false);
        });
        peer.on('error', (err) => {
            console.error(err);
            connStatusSpan.innerHTML = '⚠️ 连接服务失败，请刷新';
        });
    }

    // 事件绑定
    copyRoomBtn.addEventListener('click', () => {
        if (localId) {
            copyToClipboard(localId);
            copyRoomBtn.innerText = '✅ 已复制';
            setTimeout(() => copyRoomBtn.innerText = '📋 复制房间号', 1500);
        }
    });

    sendBtn.addEventListener('click', () => {
        const text = sendInput.value.trim();
        if (!text) return;
        const success = sendMessageToPeer(text);
        if (success) {
            sendInput.value = '';
        } else {
            // 不弹 alert，而是更新状态栏提示
            connStatusSpan.innerHTML = '❌ 发送失败：未连接或连接异常';
            setTimeout(() => {
                if (currentConn?.open) connStatusSpan.innerHTML = '✅ 已连接';
                else connStatusSpan.innerHTML = '🟢 房间已创建，等待连接...';
            }, 2000);
        }
    });

    clearHistoryBtn.addEventListener('click', () => {
        if (confirm('清空暂存箱所有记录？')) {
            saveHistory([]);
            renderMessageList();
        }
    });

    joinBtn.addEventListener('click', () => connectToPeer(remotePeerIdInput.value));
    mobileSendBtn.addEventListener('click', () => {
        const text = mobileSendInput.value.trim();
        if (!text) return;
        if (currentConn && currentConn.open) {
            currentConn.send({ type: 'text', data: text, from: 'mobile' });
            appendMobileReceived(`🚀 我发送: ${text}`);
            mobileSendInput.value = '';
        } else {
            mobileConnStatus.innerText = '❌ 未连接电脑，请先输入房间号连接';
        }
    });

    // 初始渲染
    renderMessageList();
    initPeer();
</script>
</body>
</html>
